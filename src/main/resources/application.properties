spring.jpa.show-sql=${SHOW_SQL}
spring.jpa.hibernate.ddl-auto=${DB_MODE}
spring.datasource.url=${DB_URL_PREFIX}${MYSQL_HOST:${DB_URL}}:${DB_PORT}/${DB_NAME}?${DB_OPTIONS}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
metrics.property.enableAutomaticUpdates=${AUTO_UPDATE}
metrics.property.show-update-progress=${SHOW_PROGRESS}
metrics.property.showCardsUpdated=false
metrics.property.allowShutdownEndpoint=false
metrics.property.printSimpleScoreOutput=false
logging.pattern.console=%d{yyyy-MM-dd} %d{HH:mm:ss.SSS} | %-5p | %-50.50logger{50} | %-25.-25M | %m%n
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true